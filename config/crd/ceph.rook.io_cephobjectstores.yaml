                    nullable: true
                    type: string
                  crushRoot:
                    description: The root of the crush hierarchy utilized by the pool
                    nullable: true
                    type: string
                  deviceClass:
                    description: The device class the OSD should set to for use in
                      the pool
                    nullable: true
                    type: string
                  enableCrushUpdates:
                    description: Allow rook operator to change the pool CRUSH tunables
                      once the pool is created
                    nullable: true
                    type: boolean
                  enableRBDStats:
                    description: EnableRBDStats is used to enable gathering of statistics
                      for all RBD images in the pool
                    type: boolean
                  erasureCoded:
                    description: The erasure code settings
                    properties:
                      algorithm:
                        description: |-
                          The algorithm for erasure coding.
                          If absent, defaults to the plugin specified in osd_pool_default_erasure_code_profile.
                        enum:
                        - isa
                        - jerasure
                        type: string
                      codingChunks:
                        description: |-
                          Number of coding chunks per object in an erasure coded storage pool (required for erasure-coded pool type).
                          This is the number of OSDs that can be lost simultaneously before data cannot be recovered.
                        minimum: 0
                        type: integer
                      crushNumFailureDomains:
                        description: |-
                          Number of failure domains to use for erasure coded chunk placement.
                          When specified along with crushOSDsPerFailureDomain, a CRUSH MSR rule will be created
                          that distributes chunks across this many failure domains.
                        format: int32
                        minimum: 1
                        type: integer
                      crushOSDsPerFailureDomain:
                        description: |-
                          Number of OSDs allowed per failure domain for erasure coded chunk placement.
                          When specified along with crushNumFailureDomains, a CRUSH MSR rule will be created
                          that allows up to this many chunks on OSDs within each failure domain.
                        format: int32
                        minimum: 1
                        type: integer
                      dataChunks:
                        description: |-
                          Number of data chunks per object in an erasure coded storage pool (required for erasure-coded pool type).
                          The number of chunks required to recover an object when any single OSD is lost is the same
                          as dataChunks so be aware that the larger the number of data chunks, the higher the cost of recovery.
                        minimum: 0
                        type: integer
                      stripeUnit:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          Erasure code stripe size in bytes. Ceph default is 4096 bytes (4 KiB).
                          Value must be a multiple of 4096 (4Ki).
                        enum:
                        - 4Ki
                        - 16Ki
                        - 64Ki
                        - 256Ki
                        - 1Mi
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - codingChunks
                    - dataChunks
                    type: object
                    x-kubernetes-validations:
                    - message: crushNumFailureDomains and crushOSDsPerFailureDomain
                        must be specified together
                      rule: has(self.crushNumFailureDomains) == has(self.crushOSDsPerFailureDomain)
                  failureDomain:
                    description: 'The failure domain: osd/host/(region or zone if
                      available) - technically also any type in the crush map'
                    type: string
                  mirroring:
                    description: The mirroring settings
                    properties:
                      enabled:
                        description: Enabled whether this pool is mirrored or not
                        type: boolean
                      mode:
                        description: 'Mode is the mirroring mode: pool, image or init-only.'
                        enum:
                        - pool
                        - image
                        - init-only
                        type: string
                      peers:
                        description: Peers represents the peers spec
                        nullable: true
                        properties:
                          secretNames:
                            description: SecretNames represents the Kubernetes Secret
                              names to add rbd-mirror or cephfs-mirror peers
                            items:
                              type: string
                            type: array
                        type: object
                      snapshotSchedules:
                        description: SnapshotSchedules is the scheduling of snapshot
