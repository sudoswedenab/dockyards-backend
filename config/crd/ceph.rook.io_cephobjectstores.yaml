                            interval:
                              description: Interval represent the periodicity of the
                                snapshot.
                              type: string
                            path:
                              description: Path is the path to snapshot, only valid
                                for CephFS
                              type: string
                            startTime:
                              description: StartTime indicates when to start the snapshot
                              type: string
                          type: object
                        type: array
                    type: object
                  parameters:
                    additionalProperties:
