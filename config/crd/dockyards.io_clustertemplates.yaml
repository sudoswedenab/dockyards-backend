apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clustertemplates.dockyards.io
spec:
  group: dockyards.io
  names:
    kind: ClusterTemplate
    listKind: ClusterTemplateList
    plural: clustertemplates
    singular: clustertemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha3
    schema:
      openAPIV3Schema:
        description: ClusterTemplate defines reusable cluster defaults and node pool
          templates.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the template configuration used when creating
              clusters.
            properties:
              nodePoolTemplates:
                description: NodePoolTemplates lists the node pool templates applied
                  to clusters using this template.
                items:
                  description: NodePoolTemplate defines a node pool template included
                    in a cluster template.
                  properties:
                    metadata:
                      properties:
                        annotations:
                          additionalProperties:
                            type: string
                          type: object
                        finalizers:
                          items:
                            type: string
                          type: array
                        labels:
                          additionalProperties:
                            type: string
                          type: object
                        name:
                          type: string
                        namespace:
                          type: string
                      type: object
                    spec:
                      description: Spec defines the desired configuration for this
                        node pool template.
                      properties:
                        controlPlane:
                          description: ControlPlane marks nodes in this pool as control
                            plane nodes.
                          type: boolean
                        dedicatedRole:
                          description: DedicatedRole prevents scheduling general workloads
                            on these nodes.
                          type: boolean
                        loadBalancer:
                          description: LoadBalancer marks nodes in this pool as load
                            balancer nodes.
                          type: boolean
                        nodeAnnotations:
                          additionalProperties:
                            type: string
                          description: NodeAnnotations are applied to Kubernetes Node
                            objects created from this pool.
                          type: object
                        nodeClassRef:
                          description: NodeClassRef references a NodeClass used for
                            node scheduling defaults.
                          properties:
                            apiGroup:
                              description: |-
                                APIGroup is the group for the resource being referenced.
                                If APIGroup is not specified, the specified Kind must be in the core API group.
                                For any other third-party types, APIGroup is required.
                              type: string
                            kind:
                              description: Kind is the type of resource being referenced
                              type: string
                            name:
                              description: Name is the name of resource being referenced
                              type: string
                            namespace:
                              description: |-
                                Namespace is the namespace of resource being referenced
                                Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                                (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                        nodeLabels:
                          additionalProperties:
                            type: string
                          description: NodeLabels are applied to Kubernetes Node objects
                            created from this pool.
                          type: object
                        nodeTaints:
                          additionalProperties:
                            type: string
                          description: NodeTaints are applied to Kubernetes Node objects
                            created from this pool.
                          type: object
                        releaseRef:
                          description: ReleaseRef references the OS or image release
                            used by this node pool.
                          properties:
                            apiGroup:
                              description: |-
                                APIGroup is the group for the resource being referenced.
                                If APIGroup is not specified, the specified Kind must be in the core API group.
                                For any other third-party types, APIGroup is required.
                              type: string
                            kind:
                              description: Kind is the type of resource being referenced
                              type: string
                            name:
                              description: Name is the name of resource being referenced
                              type: string
                            namespace:
                              description: |-
                                Namespace is the namespace of resource being referenced
                                Note that when a namespace is specified, a gateway.networking.k8s.io/ReferenceGrant object is required in the referent namespace to allow that namespace's owner to accept the reference. See the ReferenceGrant documentation for details.
                                (Alpha) This field requires the CrossNamespaceVolumeDataSource feature gate to be enabled.
                              type: string
                          required:
                          - kind
                          - name
                          type: object
                        replicas:
                          description: Replicas is the desired number of nodes in
                            the pool.
                          format: int32
                          type: integer
                        resources:
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          description: Resources configures requested compute resources
                            per node.
                          type: object
                        security:
                          description: Security defines security settings applied
                            to nodes in this pool.
                          properties:
                            enableAppArmor:
                              description: EnableAppArmor enables AppArmor support
                                on nodes in this pool.
                              type: boolean
                          type: object
                        storage:
                          description: Storage enables storage capabilities for nodes
                            in this pool.
                          type: boolean
                        storageResources:
                          description: StorageResources defines additional storage
                            resource capacities per node.
                          items:
                            description: NodePoolStorageResource defines an additional
                              storage resource exposed by nodes in the pool.
                            properties:
                              name:
                                description: Name is the resource name advertised
                                  on nodes.
                                type: string
                              quantity:
                                anyOf:
                                - type: integer
                                - type: string
                                description: Quantity is the allocatable amount exposed
                                  for this resource.
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              type:
                                description: Type defines the storage backing type.
                                type: string
                            required:
                            - name
                            - quantity
                            type: object
                          type: array
                      type: object
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
